<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#090b0d"><meta name="apple-mobile-web-app-capable" content="yes"><title>COLLAGE MACHINE</title><link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}body{margin:0;background:#090b0d;color:#f4f0e8;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;overscroll-behavior:none}.app{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto}.top,.bottom{display:flex;gap:8px;align-items:center;padding:10px;background:#111519;border-bottom:1px solid #30363d;flex-wrap:wrap}.bottom{border:0;border-top:1px solid #30363d;position:sticky;bottom:0;z-index:9}.brand{font-weight:900;letter-spacing:.14em;margin-right:auto}.workspace{display:grid;grid-template-columns:1fr 270px;min-height:0}.stageWrap{padding:10px;min-width:0}.stage{position:relative;width:100%;height:calc(100dvh - 150px);min-height:420px;overflow:hidden;background:#e9e1cf;touch-action:none}.stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 3px,#0000000b 4px);mix-blend-mode:multiply}.empty{position:absolute;inset:0;display:grid;place-items:center;color:#171717;text-align:center;padding:40px;letter-spacing:.08em}.piece{position:absolute;transform-origin:center;user-select:none;-webkit-user-drag:none;max-width:none}.piece.locked{outline:2px solid #ff3ea5}.panel{padding:12px;border-left:1px solid #30363d;overflow:auto}.control{margin:0 0 13px}.control label{display:flex;justify-content:space-between;margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em}.control input{width:100%}.sources{display:flex;gap:6px;overflow:auto;max-width:100%}.thumb{width:48px;height:48px;object-fit:cover;border:1px solid #555;border-radius:3px}.btn{appearance:none;border:1px solid #555;background:#171c20;color:#fff;padding:9px 11px;border-radius:4px;font:inherit;font-weight:800}.btn.hot{background:#ff3ea5;color:#080808;border-color:#ff3ea5}.btn.on{background:#c8ff42;color:#080808}.seed{opacity:.65}@media(max-width:760px){.workspace{grid-template-columns:1fr}.panel{border:0;border-top:1px solid #30363d;display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.stage{height:58dvh;min-height:350px}.control{margin-bottom:9px}.top{position:sticky;top:0;z-index:10}.brand{width:100%}.sources{order:9;width:100%}}
</style></head><body><div class="app">
<div class="top"><div class="brand">COLLAGE MACHINE ✂︎ SIGNAL / MEMORY / DECAY</div><button class="btn" id="upload">+ UPLOAD</button><input id="files" type="file" accept="image/*" multiple hidden><button class="btn hot" id="remix">REMIX</button><button class="btn" id="live">LIVE</button><button class="btn" id="export">EXPORT PNG</button><span class="seed" id="seed"></span></div>
<div class="workspace"><div class="stageWrap"><div class="stage" id="stage"><div class="empty" id="empty">UPLOAD IMAGES<br><br>then hit REMIX<br><br>tap a fragment to lock it</div></div></div><aside class="panel" id="panel"></aside></div>
<div class="bottom"><button class="btn" id="random">RANDOM SEED</button><button class="btn" id="unlock">UNLOCK ALL</button><button class="btn" id="clear">CLEAR</button><div class="sources" id="sources"></div></div></div>
<script>
const $=s=>document.querySelector(s),stage=$('#stage'),sources=[],pieces=[];let seed=(Date.now()>>>0),live=false,raf=0;
const P={chaos:68,density:55,repetition:25,transparency:18,glitch:36,rgb:22,rotation:45,scale:55,fragment:38};
function rng(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296} function rr(a,b){return a+rng()*(b-a)}
function controls(){const p=$('#panel');p.innerHTML='';Object.keys(P).forEach(k=>{const d=document.createElement('div');d.className='control';d.innerHTML='<label><span>'+k+'</span><b>'+P[k]+'</b></label><input type="range" min="0" max="100" value="'+P[k]+'">';d.querySelector('input').oninput=e=>{P[k]=+e.target.value;d.querySelector('b').textContent=P[k]};p.appendChild(d)})}
function renderSources(){const box=$('#sources');box.innerHTML='';sources.forEach((s,i)=>{const im=new Image;im.src=s.url;im.className='thumb';im.onclick=()=>{s.active=!s.active;im.style.opacity=s.active?1:.25};box.appendChild(im)})}
function clearPieces(){pieces.splice(0).forEach(p=>p.el.remove())}
function remix(){if(!sources.some(s=>s.active))return;const locked=pieces.filter(p=>p.locked);pieces.filter(p=>!p.locked).forEach(p=>p.el.remove());pieces.splice(0,pieces.length,...locked);$('#empty').style.display='none';seed=seed>>>0;const active=sources.filter(s=>s.active),n=Math.max(4,Math.round(6+P.density*.22));
for(let i=0;i<n;i++){const s=active[Math.floor(rng()*active.length)],im=new Image;im.src=s.url;im.className='piece';const w=rr(22,58)*(0.55+P.scale/100),x=rr(-10,90),y=rr(-10,90),rot=rr(-P.rotation*1.8,P.rotation*1.8),op=1-P.transparency/130* rng(),blend=['normal','multiply','screen','difference','hard-light'][Math.floor(rng()*5)],clip=P.fragment>15?'polygon('+rr(0,22)+'% '+rr(0,18)+'%,'+rr(78,100)+'% '+rr(0,20)+'%,'+rr(80,100)+'% '+rr(78,100)+'%,'+rr(0,20)+'% '+rr(78,100)+'%)':'none';Object.assign(im.style,{width:w+'%',left:x+'%',top:y+'%',opacity:op,mixBlendMode:blend,clipPath:clip,filter:'contrast('+rr(.85,1.45)+') saturate('+rr(.55,1.5)+') hue-rotate('+rr(-P.rgb,P.rgb)+'deg)',transform:'rotate('+rot+'deg) scale('+rr(.75,1.35)+')'});const p={el:im,locked:false,rot,x,y,phase:rr(0,6.28)};im.onclick=e=>{e.stopPropagation();p.locked=!p.locked;im.classList.toggle('locked',p.locked)};stage.appendChild(im);pieces.push(p)}
$('#seed').textContent='SEED '+seed}
function animate(t){if(!live)return;pieces.forEach((p,i)=>{if(!p.locked){const j=P.glitch/100,dx=Math.sin(t/520+p.phase)*8*j,dy=Math.cos(t/690+p.phase)*5*j;p.el.style.translate=dx+'px '+dy+'px';p.el.style.filter+=''}});raf=requestAnimationFrame(animate)}
$('#upload').onclick=()=>$('#files').click();$('#files').onchange=async e=>{for(const f of e.target.files){const url=URL.createObjectURL(f);await new Promise(res=>{const im=new Image;im.onload=res;im.onerror=res;im.src=url});sources.push({url,active:true,name:f.name})}renderSources();remix();e.target.value=''};
$('#remix').onclick=()=>{seed=(seed+1)>>>0;remix()};$('#random').onclick=()=>{seed=(Math.random()*4294967295)>>>0;remix()};$('#unlock').onclick=()=>pieces.forEach(p=>{p.locked=false;p.el.classList.remove('locked')});$('#clear').onclick=()=>{clearPieces();sources.splice(0);renderSources();$('#empty').style.display='grid'};
$('#live').onclick=e=>{live=!live;e.target.classList.toggle('on',live);e.target.textContent=live?'LIVE ●':'LIVE';cancelAnimationFrame(raf);if(live)raf=requestAnimationFrame(animate)};
$('#export').onclick=async()=>{const r=stage.getBoundingClientRect(),c=document.createElement('canvas');c.width=Math.round(r.width*2);c.height=Math.round(r.height*2);const ctx=c.getContext('2d');ctx.scale(2,2);ctx.fillStyle='#e9e1cf';ctx.fillRect(0,0,r.width,r.height);for(const p of pieces){const b=p.el.getBoundingClientRect();ctx.save();ctx.globalAlpha=parseFloat(getComputedStyle(p.el).opacity)||1;ctx.translate(b.left-r.left+b.width/2,b.top-r.top+b.height/2);ctx.rotate(p.rot*Math.PI/180);try{ctx.drawImage(p.el,-b.width/2,-b.height/2,b.width,b.height)}catch{}ctx.restore()}const a=document.createElement('a');a.download='collage-'+seed+'.png';a.href=c.toDataURL('image/png');a.click()};
controls();$('#seed').textContent='SEED '+seed;if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
