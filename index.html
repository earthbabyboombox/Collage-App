<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#080a0c"><meta name="apple-mobile-web-app-capable" content="yes"><title>COLLAGE MACHINE</title><link rel="manifest" href="manifest.webmanifest"><style>
*{box-sizing:border-box}html,body{margin:0;background:#080a0c;color:#f5f0e6;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;overscroll-behavior:none}button,input{font:inherit}.app{min-height:100dvh}.top{position:sticky;top:0;z-index:20;background:#101418eF;backdrop-filter:blur(12px);padding:10px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #343a40}.brand{font-weight:950;letter-spacing:.13em;margin-right:auto}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 285px}.stageWrap{padding:10px}.stage{position:relative;height:calc(100dvh - 135px);min-height:430px;overflow:hidden;background:#e8dfca;touch-action:none;isolation:isolate}.stage:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:999;background:repeating-linear-gradient(0deg,#0000 0 3px,#0000000b 4px);mix-blend-mode:multiply}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#171717;letter-spacing:.12em;line-height:1.8;padding:30px}.piece{position:absolute;max-width:none;transform-origin:center;user-select:none;-webkit-user-drag:none;touch-action:none}.piece.locked{outline:2px solid #ff3ea5;outline-offset:3px}.panel{border-left:1px solid #343a40;padding:12px;overflow:auto}.section{font-weight:900;letter-spacing:.12em;color:#c9ff46;margin:5px 0 11px}.control{margin:0 0 12px}.control label{display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}.control input{width:100%;accent-color:#ff3ea5}.btn{appearance:none;border:1px solid #515860;background:#171c21;color:#fff;border-radius:5px;padding:9px 11px;font-weight:850}.btn.hot{background:#ff3ea5;color:#090909;border-color:#ff3ea5}.btn.on{background:#c9ff46;color:#080808}select.btn{max-width:130px;background:#222830;color:#c9ff46}.bottom{position:sticky;bottom:0;z-index:20;background:#101418eF;backdrop-filter:blur(12px);border-top:1px solid #343a40;padding:8px 10px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}.sources{display:flex;gap:6px;overflow:auto;flex:1}.thumb{width:48px;height:48px;object-fit:cover;border:1px solid #5a626b;border-radius:4px}.seed{opacity:.65}.hint{opacity:.55;font-size:10px}@media(max-width:760px){.workspace{grid-template-columns:1fr}.stage{height:57dvh;min-height:350px}.panel{border-left:0;border-top:1px solid #343a40;display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.stageWrap{padding:6px}.brand{width:100%}.bottom{padding-bottom:max(8px,env(safe-area-inset-bottom))}.hint{display:none}}
</style></head><body><div class="app"><header class="top"><div class="brand">COLLAGE MACHINE // SIGNAL + MEMORY + DECAY</div><button class="btn" id="upload">+ IMAGES</button><input id="files" type="file" accept="image/*" multiple hidden><button class="btn hot" id="remix">REMIX</button><button class="btn" id="live">LIVE</button><button class="btn" id="export">EXPORT</button><span class="seed" id="seed"></span><select id="mode" class="btn" aria-label="Composition mode"><option>ORGANIC</option><option>DADA</option><option>BRUTALIST</option><option>SHRINE</option><option>EXPLOSION</option></select><button class="btn" id="surprise">⚡ SURPRISE</button></header>
<main class="workspace"><div class="stageWrap"><div class="stage" id="stage"><div class="empty" id="empty">FEED THE MACHINE<br>choose several images<br><br>REMIX creates a composition<br>drag fragments • pinch to scale • tap to lock</div></div></div><aside class="panel"><div style="grid-column:1/-1" class="section">MUTATION ENGINE</div><div id="controls" style="display:contents"></div></aside></main>
<footer class="bottom"><button class="btn" id="random">NEW SEED</button><button class="btn" id="undo">UNDO</button><button class="btn" id="unlock">UNLOCK</button><button class="btn" id="clear">CLEAR</button><span class="hint">tap thumbnail = mute source</span><div class="sources" id="sources"></div></footer></div><script>
const $=s=>document.querySelector(s),stage=$('#stage'),sources=[],pieces=[];let seed=Date.now()>>>0,live=false,raf=0,history=[];
const P={chaos:64,density:52,fragment:52,repetition:25,transparency:14,glitch:32,rgb:18,rotation:38,scale:54,contrast:42,halftone:18,tear:28,grain:22};
function rng(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}const rr=(a,b)=>a+rng()*(b-a);
function makeControls(){const box=$('#controls');Object.keys(P).forEach(k=>{let d=document.createElement('div');d.className='control';d.innerHTML='<label><span>'+k+'</span><b>'+P[k]+'</b></label><input type=range min=0 max=100 value='+P[k]+'>';d.querySelector('input').oninput=e=>{P[k]=+e.target.value;d.querySelector('b').textContent=P[k]};box.appendChild(d)})}
function thumbs(){let b=$('#sources');b.innerHTML='';sources.forEach(s=>{let i=new Image;i.src=s.url;i.className='thumb';i.style.opacity=s.active?1:.25;i.onclick=()=>{s.active=!s.active;thumbs()};b.appendChild(i)})}
function snap(){history.push(pieces.filter(p=>!p.locked).map(p=>({src:p.el.src,css:p.el.style.cssText,rot:p.rot})));if(history.length>8)history.shift()}
function addPiece(src,css,rot=0){let im=new Image;im.src=src;im.className='piece';im.style.cssText=css;let p={el:im,locked:false,rot,phase:rr(0,6.28),scale:1};im.onclick=e=>{if(p.moved){p.moved=false;return}e.stopPropagation();p.locked=!p.locked;im.classList.toggle('locked',p.locked)};let sx,sy,ol,ot,dist0,scale0;
im.onpointerdown=e=>{if(p.locked)return;im.setPointerCapture(e.pointerId);p.moved=false;sx=e.clientX;sy=e.clientY;ol=parseFloat(im.style.left);ot=parseFloat(im.style.top)};
im.onpointermove=e=>{if(!im.hasPointerCapture(e.pointerId)||p.locked)return;let r=stage.getBoundingClientRect(),dx=(e.clientX-sx)/r.width*100,dy=(e.clientY-sy)/r.height*100;if(Math.abs(dx)+Math.abs(dy)>.5)p.moved=true;im.style.left=ol+dx+'%';im.style.top=ot+dy+'%'};
stage.appendChild(im);pieces.push(p);return p}
function remix(){let a=sources.filter(s=>s.active);if(!a.length)return;snap();pieces.filter(p=>!p.locked).forEach(p=>p.el.remove());let locked=pieces.filter(p=>p.locked);pieces.splice(0,pieces.length,...locked);$('#empty').style.display='none';
let mode=$('#mode').value,n=Math.round(5+P.density*.25),cx=50,cy=45;
for(let j=0;j<n;j++){let src=a[Math.floor(rng()*a.length)],w=rr(16,52)*(0.65+P.scale/120),x=rr(-12,91),y=rr(-12,91),rot=rr(-P.rotation*1.7,P.rotation*1.7);
if(mode==='BRUTALIST'){x=(j%3)*32+rr(-4,4);y=Math.floor(j/3)*24+rr(-4,4);rot=rr(-4,4)}
if(mode==='SHRINE'){x=cx-w/2+rr(-12,12);y=cy-w/3+rr(-18,18);rot=rr(-12,12)}
if(mode==='EXPLOSION'){let ang=rr(0,Math.PI*2),rad=rr(4,48);x=cx+Math.cos(ang)*rad-w/2;y=cy+Math.sin(ang)*rad-w/3;rot=ang*57.3+rr(-25,25)}
if(mode==='DADA'){rot=rr(-90,90);w*=rr(.65,1.35)}
let op=1-rng()*P.transparency/115,bl=['normal','multiply','screen','difference','hard-light','color-burn','overlay'][Math.floor(rng()*7)];
let jag=Math.max(3,Math.round(P.fragment/12)),pts=[];for(let k=0;k<jag;k++)pts.push((k/(jag-1)*100)+'% '+rr(0,18)+'%');for(let k=jag-1;k>=0;k--)pts.push((k/(jag-1)*100)+'% '+rr(82,100)+'%');let cut=P.fragment<8?'none':'polygon('+pts.join(',')+')';
let filter='contrast('+(0.75+P.contrast/100+rr(-.2,.25))+') saturate('+rr(.4,1.7)+') hue-rotate('+rr(-P.rgb*1.8,P.rgb*1.8)+'deg)';
let css='width:'+w+'%;left:'+x+'%;top:'+y+'%;opacity:'+op+';mix-blend-mode:'+bl+';clip-path:'+cut+';filter:'+filter+';transform:rotate('+rot+'deg) scale('+rr(.78,1.25)+')';
let p=addPiece(src.url,css,rot);p.el.style.boxShadow=rng()<P.grain/100?'0 0 '+rr(1,5)+'px rgba(0,0,0,.28)':'none';
if(rng()<P.repetition/125){let css2=css.replace('left:'+x+'%','left:'+(x+rr(2,14))+'%').replace('top:'+y+'%','top:'+(y+rr(-9,9))+'%');let q=addPiece(src.url,css2,rot+rr(-12,12));q.el.style.opacity=.45}
if(rng()<P.tear/160){let css3=css.replace('left:'+x+'%','left:'+(x+rr(-5,5))+'%').replace('top:'+y+'%','top:'+(y+rr(3,12))+'%');let q=addPiece(src.url,css3,rot+rr(-5,5));q.el.style.mixBlendMode='difference';q.el.style.opacity=.28}}
stage.style.backgroundImage=P.halftone>5?'radial-gradient(#00000022 '+Math.max(.4,P.halftone/55)+'px,transparent '+Math.max(.8,P.halftone/28)+'px)':'none';stage.style.backgroundSize='5px 5px';$('#seed').textContent='SEED '+seed}
function anim(t){if(!live)return;pieces.forEach(p=>{if(!p.locked){let j=P.glitch/100;p.el.style.translate=(Math.sin(t/470+p.phase)*10*j+(Math.sin(t/83+p.phase)>0.96?P.tear*j:0))+'px '+(Math.cos(t/610+p.phase)*6*j)+'px'}});raf=requestAnimationFrame(anim)}
$('#upload').onclick=()=>$('#files').click();$('#files').onchange=async e=>{for(let f of e.target.files){let u=URL.createObjectURL(f);await new Promise(ok=>{let i=new Image;i.onload=i.onerror=ok;i.src=u});sources.push({url:u,active:true})}thumbs();remix();e.target.value=''};
$('#remix').onclick=()=>{seed=(seed+1)>>>0;remix()};$('#mode').onchange=()=>remix();$('#surprise').onclick=()=>{seed=crypto.getRandomValues(new Uint32Array(1))[0];let ms=['ORGANIC','DADA','BRUTALIST','SHRINE','EXPLOSION'];$('#mode').value=ms[Math.floor(Math.random()*ms.length)];Object.keys(P).forEach(k=>P[k]=Math.round(10+Math.random()*85));document.querySelectorAll('.control').forEach(d=>{let k=d.querySelector('span').textContent,v=P[k];d.querySelector('input').value=v;d.querySelector('b').textContent=v});remix()};$('#random').onclick=()=>{seed=crypto.getRandomValues(new Uint32Array(1))[0];remix()};$('#unlock').onclick=()=>pieces.forEach(p=>{p.locked=false;p.el.classList.remove('locked')});$('#clear').onclick=()=>{pieces.splice(0).forEach(p=>p.el.remove());sources.splice(0).forEach(s=>URL.revokeObjectURL(s.url));thumbs();$('#empty').style.display='grid'};
$('#undo').onclick=()=>{let h=history.pop();if(!h)return;pieces.filter(p=>!p.locked).forEach(p=>p.el.remove());let locked=pieces.filter(p=>p.locked);pieces.splice(0,pieces.length,...locked);h.forEach(q=>addPiece(q.src,q.css,q.rot))};
$('#live').onclick=e=>{live=!live;e.currentTarget.classList.toggle('on',live);e.currentTarget.textContent=live?'LIVE ●':'LIVE';cancelAnimationFrame(raf);if(live)raf=requestAnimationFrame(anim)};
$('#export').onclick=async()=>{let r=stage.getBoundingClientRect(),c=document.createElement('canvas'),d=Math.min(2,devicePixelRatio||1);c.width=r.width*d;c.height=r.height*d;let x=c.getContext('2d');x.scale(d,d);x.fillStyle='#e8dfca';x.fillRect(0,0,r.width,r.height);for(let p of pieces){let b=p.el.getBoundingClientRect();x.save();x.globalAlpha=parseFloat(getComputedStyle(p.el).opacity)||1;x.translate(b.left-r.left+b.width/2,b.top-r.top+b.height/2);x.rotate(p.rot*Math.PI/180);try{x.drawImage(p.el,-b.width/2,-b.height/2,b.width,b.height)}catch{}x.restore()}c.toBlob(blob=>{let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='collage-'+seed+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')};
makeControls();$('#seed').textContent='SEED '+seed;if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
